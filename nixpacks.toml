[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "cairo", "pango", "libffi", "glib"]

[phases.install]
cmds = ["python3 -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port $PORT"
