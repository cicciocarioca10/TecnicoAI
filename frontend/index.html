<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnicoAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --bg2: #161922;
      --bg3: #1e2130;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --text: #e5e7eb;
      --text-muted: #6b7280;
      --border: #2d3148;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      height: 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo { font-size: 22px; }
    .app-name { font-size: 16px; font-weight: 600; color: var(--accent); }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s;
    }
    .btn-icon:hover { background: var(--bg3); }
    .btn-new {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-new:hover { background: var(--accent-dark); }
    .btn-export {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-export:hover { background: var(--bg3); color: var(--text); }

    /* ── SIDEBAR ── */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: all; }
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 280px;
      height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      z-index: 21;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title { font-weight: 600; font-size: 14px; }
    .sidebar-close {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; font-size: 18px; line-height: 1;
    }
    .conv-list { overflow-y: auto; flex: 1; padding: 8px; }
    .conv-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
      gap: 8px;
    }
    .conv-item:hover { background: var(--bg3); }
    .conv-item.active { background: var(--bg3); border-left: 2px solid var(--accent); padding-left: 10px; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-title {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .conv-delete {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; font-size: 18px;
      padding: 2px 4px; line-height: 1;
      flex-shrink: 0; border-radius: 4px;
    }
    .conv-delete:hover { color: var(--error); background: rgba(239,68,68,0.1); }
    .conv-empty { padding: 16px; color: var(--text-muted); font-size: 13px; }

    /* ── MAIN ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
      padding: 32px;
    }
    .empty-state .big-icon { font-size: 52px; }
    .empty-state h2 { font-size: 22px; color: var(--text); font-weight: 600; }
    .empty-state p { font-size: 14px; max-width: 300px; line-height: 1.6; }

    /* ── MESSAGE BUBBLES ── */
    .msg-wrapper { display: flex; flex-direction: column; }
    .msg-wrapper.user { align-items: flex-end; }
    .msg-wrapper.assistant { align-items: flex-start; }
    .msg-bubble {
      max-width: min(520px, 82vw);
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-wrapper.user .msg-bubble {
      background: var(--accent);
      color: #000;
      border-bottom-right-radius: 5px;
    }
    .msg-wrapper.assistant .msg-bubble {
      background: var(--bg3);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }
    .msg-image {
      max-width: 220px; max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      display: block;
    }
    .msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Markdown inside AI bubble */
    .msg-wrapper.assistant .msg-bubble p { margin: 4px 0; }
    .msg-wrapper.assistant .msg-bubble strong { font-weight: 600; }
    .msg-wrapper.assistant .msg-bubble em { font-style: italic; }
    .msg-wrapper.assistant .msg-bubble code {
      background: rgba(0,0,0,0.35);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
    }
    .msg-wrapper.assistant .msg-bubble pre {
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-wrapper.assistant .msg-bubble pre code {
      background: none; padding: 0;
    }
    .msg-wrapper.assistant .msg-bubble ul,
    .msg-wrapper.assistant .msg-bubble ol {
      padding-left: 20px; margin: 4px 0;
    }
    .msg-wrapper.assistant .msg-bubble li { margin: 3px 0; }

    /* ── TYPING INDICATOR ── */
    .typing-indicator { display: none; }
    .typing-indicator.visible { display: flex; }
    .typing-bubble {
      background: var(--bg3);
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── INPUT AREA ── */
    .input-area {
      flex-shrink: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 16px 14px;
    }
    .image-preview-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .image-preview-wrap.visible { display: flex; }
    .image-thumb {
      width: 52px; height: 52px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .remove-image {
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      width: 22px; height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-row { display: flex; align-items: flex-end; gap: 8px; }
    #message-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      overflow-y: auto;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.15s;
    }
    #message-input:focus { border-color: var(--accent); }
    #message-input::placeholder { color: var(--text-muted); }
    .btn-attach, .btn-send {
      width: 42px; height: 42px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-attach {
      background: var(--bg3);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-attach:hover { background: var(--border); color: var(--text); }
    .btn-send { background: var(--accent); color: #000; }
    .btn-send:hover { background: var(--accent-dark); }
    .btn-send:disabled { background: var(--bg3); color: var(--text-muted); cursor: not-allowed; }
    #file-input { display: none; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── ERROR TOAST ── */
    .error-msg {
      text-align: center;
      color: var(--error);
      font-size: 13px;
      padding: 6px 12px;
      background: rgba(239,68,68,0.1);
      border-radius: 8px;
      align-self: center;
    }
    /* ── SCHEMA BUTTON ── */
    .btn-schema {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 42px; height: 42px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-schema:hover { background: var(--border); color: var(--text); }

    /* ── DOMAIN MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 360px;
      max-width: 90vw;
    }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .domain-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-domain {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.15s;
    }
    .btn-domain:hover { border-color: var(--accent); color: var(--accent); }
    .btn-domain.selected { border-color: var(--accent); background: rgba(245,158,11,0.15); color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-generate {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── SCHEMA VIEWER PANEL ── */
    .schema-panel {
      position: fixed;
      top: 0; right: 0;
      width: min(680px, 100vw);
      height: 100vh;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      z-index: 25;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .schema-panel.open { transform: translateX(0); }
    .schema-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .schema-panel-title { font-weight: 600; font-size: 15px; }
    .schema-complexity-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-svg { background: rgba(46,125,50,0.2); color: #66bb6a; }
    .badge-graphviz { background: rgba(30,136,229,0.2); color: #42a5f5; }
    .schema-panel-actions {
      display: flex; gap: 6px;
      align-items: center;
    }
    .btn-panel-icon {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn-panel-icon:hover { color: var(--text); background: var(--border); }
    .schema-panel-close {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; font-size: 20px; line-height: 1;
      padding: 4px;
    }
    .schema-content {
      flex: 1;
      overflow: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .schema-svg-wrap {
      width: 100%;
      overflow: auto;
      background: white;
      border-radius: 8px;
    }
    .schema-svg-wrap svg {
      width: 100%;
      height: auto;
    }
    .schema-pdf-frame {
      width: 100%;
      flex: 1;
      border: none;
      border-radius: 8px;
      min-height: 0;
    }
    .schema-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 14px;
      gap: 10px;
    }
    .schema-error {
      color: var(--error);
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    /* ── AUTH OVERLAY ── */
    #auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg);
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: min(420px, 90vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .auth-logo { font-size: 48px; line-height: 1; }
    .auth-title { font-size: 26px; font-weight: 700; color: var(--accent); }
    .auth-subtitle { color: var(--text-muted); font-size: 13px; margin-top: -12px; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .auth-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
    }
    .auth-input:focus { outline: none; border-color: var(--accent); }
    .auth-btn {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
      margin-top: 4px;
    }
    .auth-btn:hover { background: var(--accent-dark); }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch { font-size: 13px; color: var(--text-muted); }
    .auth-switch a { color: var(--accent); cursor: pointer; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-error { color: var(--error); font-size: 13px; text-align: center; min-height: 16px; }

    /* ── USER WIDGET ── */
    .user-widget { display: flex; align-items: center; gap: 8px; }
    .user-name {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn-logout:hover { color: var(--error); border-color: var(--error); }
  </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="auth-overlay">
  <!-- Login -->
  <div class="auth-card" id="auth-login-card">
    <div class="auth-logo">⚡</div>
    <div class="auth-title">TecnicoAI</div>
    <div class="auth-subtitle">Assistente AI per tecnici</div>
    <form class="auth-form" onsubmit="doLogin(event)">
      <input class="auth-input" type="email" id="login-email" placeholder="Email" required autocomplete="email">
      <input class="auth-input" type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
      <button class="auth-btn" type="submit" id="login-btn">Accedi</button>
    </form>
    <div class="auth-error" id="login-error"></div>
  </div>
</div>

<header>
  <div class="header-left">
    <span class="logo">⚡</span>
    <span class="app-name">TecnicoAI</span>
  </div>
  <div class="header-right">
    <button class="btn-export" onclick="exportConversation()" title="Esporta chat">↓ Esporta</button>
    <button class="btn-new" onclick="newConversation()">+ Nuova Chat</button>
    <div class="user-widget" id="user-widget" style="display:none">
      <span class="user-name" id="user-name"></span>
      <button class="btn-logout" onclick="doLogout()">Esci</button>
    </div>
    <button class="btn-icon" onclick="openSidebar()" title="Storico conversazioni">☰</button>
  </div>
</header>

<!-- Domain Selector Modal -->
<div class="modal-overlay" id="domain-modal" onclick="closeDomainModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Genera Schema Tecnico</h3>
    <p>Seleziona il tipo di schema da generare in base alla conversazione:</p>
    <div class="domain-grid">
      <button class="btn-domain selected" data-domain="auto" onclick="selectDomain(this)">🤖 Auto</button>
      <button class="btn-domain" data-domain="elettrico" onclick="selectDomain(this)">⚡ Elettrico</button>
      <button class="btn-domain" data-domain="plc" onclick="selectDomain(this)">🔧 PLC / Controllo</button>
      <button class="btn-domain" data-domain="pneumatico" onclick="selectDomain(this)">💨 Pneumatico</button>
      <button class="btn-domain" data-domain="idraulico" onclick="selectDomain(this)">💧 Idraulico</button>
      <button class="btn-domain" data-domain="meccatronico" onclick="selectDomain(this)">⚙️ Meccatronico</button>
      <button class="btn-domain" data-domain="fieldbus" onclick="selectDomain(this)">🌐 Fieldbus</button>
      <button class="btn-domain" data-domain="safety" onclick="selectDomain(this)">🛡️ Safety</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDomainModal()">Annulla</button>
      <button class="btn-generate" id="btn-generate-schema" onclick="generateSchema()">Genera Schema</button>
    </div>
  </div>
</div>

<!-- Schema Viewer Panel -->
<div class="schema-panel" id="schema-panel">
  <div class="schema-panel-header">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="schema-panel-title">Schema Tecnico</span>
      <span class="schema-complexity-badge" id="schema-badge"></span>
    </div>
    <div class="schema-panel-actions">
      <button class="btn-panel-icon" id="btn-download-pdf" onclick="downloadSchemaPdf()" title="Scarica PDF">📄 PDF</button>
      <button class="btn-panel-icon" id="btn-copy-dot" onclick="copyDotCode()" title="Copia codice DOT" style="display:none">📋 DOT</button>
      <button class="schema-panel-close" onclick="closeSchemaPanel()">✕</button>
    </div>
  </div>
  <div class="schema-content" id="schema-content">
    <div class="schema-loading">Generazione schema in corso...</div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Storico chat</span>
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
  </div>
  <div class="conv-list" id="conv-list"></div>
</div>

<div class="main">
  <div class="chat-area" id="chat-area"></div>

  <div class="input-area">
    <div class="image-preview-wrap" id="image-preview-wrap">
      <img class="image-thumb" id="image-thumb" src="" alt="preview">
      <button class="remove-image" onclick="removeImage()" title="Rimuovi">✕</button>
    </div>
    <div class="input-row">
      <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
      <button class="btn-attach" onclick="document.getElementById('file-input').click()" title="Allega foto">📎</button>
      <button class="btn-schema" onclick="openDomainModal()" title="Genera schema tecnico">📐</button>
      <textarea
        id="message-input"
        placeholder="Scrivi un messaggio tecnico..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="btn-send" id="btn-send" onclick="sendMessage()" title="Invia">▶</button>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:8000'
  : ''; // same origin when served by Railway

let currentConvId = null;
let currentUser = null;
let attachedImage = null;
let isSending = false;
let selectedDomain = 'auto';
let currentSchemaId = null;
let currentDotCode = null;
let currentPdfUrl = null;

// ─── AUTH ──────────────────────────────────────────────────────────────────

function getToken() { return localStorage.getItem('tecnicoai_token'); }

async function authFetch(url, options = {}) {
  const token = getToken();
  const headers = { ...(options.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) { doLogout(); throw new Error('401'); }
  return res;
}

function showAuthOverlay() { document.getElementById('auth-overlay').style.display = 'flex'; }
function hideAuthOverlay() { document.getElementById('auth-overlay').style.display = 'none'; }

function showLogin() {
  document.getElementById('auth-login-card').style.display = '';
  document.getElementById('login-error').textContent = '';
}

function setCurrentUser(user) {
  currentUser = user;
  document.getElementById('user-name').textContent = user.full_name || user.email;
  document.getElementById('user-widget').style.display = 'flex';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled = true; errEl.textContent = '';
  try {
    const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      errEl.textContent = d.detail || 'Credenziali non valide'; return;
    }
    const d = await res.json();
    localStorage.setItem('tecnicoai_token', d.access_token);
    setCurrentUser(d.user);
    hideAuthOverlay();
    await init(false);
  } catch (_) { errEl.textContent = 'Errore di connessione'; }
  finally { btn.disabled = false; }
}


function doLogout() {
  localStorage.removeItem('tecnicoai_token');
  localStorage.removeItem('currentConvId');
  currentUser = null; currentConvId = null;
  document.getElementById('user-widget').style.display = 'none';
  document.getElementById('conv-list').innerHTML = '';
  showEmptyState();
  showLogin();
  showAuthOverlay();
}

// ─── STARTUP ───────────────────────────────────────────────────────────────

async function init(checkAuth = true) {
  if (checkAuth) {
    const token = getToken();
    if (!token) { showLogin(); showAuthOverlay(); return; }
    try {
      const res = await fetch(`${BACKEND_URL}/api/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) { doLogout(); return; }
      setCurrentUser(await res.json());
    } catch (_) { doLogout(); return; }
  }
  const saved = parseInt(localStorage.getItem('currentConvId'));
  await loadConversations();
  if (saved) {
    await selectConversation(saved, false);
  } else {
    showEmptyState();
  }
}

// ─── SIDEBAR / CONVERSATIONS ───────────────────────────────────────────────

async function loadConversations() {
  try {
    const res = await authFetch(`${BACKEND_URL}/api/conversations`);
    const convs = await res.json();
    renderConvList(convs);
  } catch (_) {
    document.getElementById('conv-list').innerHTML =
      '<p class="conv-empty">Errore di connessione</p>';
  }
}

function renderConvList(convs) {
  const list = document.getElementById('conv-list');
  if (!convs.length) {
    list.innerHTML = '<p class="conv-empty">Nessuna conversazione</p>';
    return;
  }
  list.innerHTML = convs.map(c => `
    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}"
         onclick="selectConversation(${c.id}, true)">
      <div class="conv-info">
        <div class="conv-title">${esc(c.title)}</div>
        <div class="conv-date">${fmtDate(c.updated_at)}</div>
      </div>
      <button class="conv-delete"
              onclick="event.stopPropagation(); deleteConversation(${c.id})"
              title="Elimina">×</button>
    </div>
  `).join('');
}

async function selectConversation(convId, closeSide) {
  currentConvId = convId;
  localStorage.setItem('currentConvId', convId);
  if (closeSide) closeSidebar();
  await loadConversations();
  await loadMessages(convId);
}

async function newConversation() {
  try {
    const res = await authFetch(`${BACKEND_URL}/api/conversations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'Nuova conversazione' }),
    });
    const conv = await res.json();
    currentConvId = conv.id;
    localStorage.setItem('currentConvId', conv.id);
    await loadConversations();
    showEmptyState();
    document.getElementById('message-input').focus();
  } catch (_) {}
}

async function deleteConversation(convId) {
  try {
    await authFetch(`${BACKEND_URL}/api/conversations/${convId}`, { method: 'DELETE' });
    if (convId === currentConvId) {
      currentConvId = null;
      localStorage.removeItem('currentConvId');
      showEmptyState();
    }
    await loadConversations();
  } catch (_) {}
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ─── MESSAGES ──────────────────────────────────────────────────────────────

async function loadMessages(convId) {
  try {
    const res = await authFetch(`${BACKEND_URL}/api/conversations/${convId}/messages`);
    if (!res.ok) { showEmptyState(); return; }
    const msgs = await res.json();
    renderMessages(msgs);
  } catch (_) { showEmptyState(); }
}

function renderMessages(msgs) {
  const area = document.getElementById('chat-area');
  area.innerHTML = '';
  if (!msgs.length) { showEmptyState(); return; }
  msgs.forEach(m => area.appendChild(makeMsgEl(m)));
  area.appendChild(makeTypingEl());
  scrollBottom();
}

function makeMsgEl(msg) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrapper ${msg.role}`;

  if (msg.image_path) {
    const img = document.createElement('img');
    img.className = 'msg-image';
    img.src = msg.image_path.startsWith('blob:')
      ? msg.image_path
      : `${BACKEND_URL}${msg.image_path}`;
    img.alt = 'Immagine allegata';
    img.onclick = () => window.open(img.src, '_blank');
    wrap.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msg.role === 'assistant') {
    bubble.innerHTML = md(msg.content);
  } else {
    bubble.textContent = msg.content;
  }
  wrap.appendChild(bubble);

  if (msg.created_at) {
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = fmtDate(msg.created_at);
    wrap.appendChild(t);
  }
  return wrap;
}

function makeTypingEl() {
  const el = document.createElement('div');
  el.className = 'typing-indicator';
  el.id = 'typing-indicator';
  el.innerHTML = `<div class="typing-bubble">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>`;
  return el;
}

function showEmptyState() {
  document.getElementById('chat-area').innerHTML = `
    <div class="empty-state">
      <span class="big-icon">⚡</span>
      <h2>TecnicoAI</h2>
      <p>Assistente specializzato per tecnici elettricisti e meccanici.<br>
         Inizia una nuova chat o seleziona una conversazione dal menu.</p>
    </div>`;
}

// ─── SEND ──────────────────────────────────────────────────────────────────

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text && !attachedImage) return;

  if (!currentConvId) {
    await newConversation();
    if (!currentConvId) return;
  }

  const area = document.getElementById('chat-area');
  const emptyState = area.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  let typingEl = document.getElementById('typing-indicator');
  if (!typingEl) {
    typingEl = makeTypingEl();
    area.appendChild(typingEl);
  }

  const userEl = makeMsgEl({
    role: 'user',
    content: text || '(immagine allegata)',
    image_path: attachedImage ? URL.createObjectURL(attachedImage) : null,
  });
  area.insertBefore(userEl, typingEl);

  input.value = '';
  autoResize(input);
  typingEl.classList.add('visible');
  scrollBottom();

  isSending = true;
  document.getElementById('btn-send').disabled = true;
  const imgToSend = attachedImage;
  removeImage();

  try {
    const fd = new FormData();
    fd.append('conversation_id', currentConvId);
    fd.append('message', text || '(immagine allegata)');
    fd.append('model', 'claude');
    if (imgToSend) fd.append('image', imgToSend);
    const res = await authFetch(`${BACKEND_URL}/api/chat`, { method: 'POST', body: fd });

    typingEl.classList.remove('visible');

    if (!res.ok) {
      appendError(area, typingEl, 'Errore dal server. Riprova più tardi.');
      return;
    }

    const data = await res.json();
    const aiEl = makeMsgEl({ role: 'assistant', content: data.reply, created_at: new Date().toISOString() });
    area.insertBefore(aiEl, typingEl);
    await loadConversations();
    scrollBottom();
  } catch (_) {
    document.getElementById('typing-indicator')?.classList.remove('visible');
    appendError(area, document.getElementById('typing-indicator'), 'Connessione persa. Verifica che il backend sia attivo.');
  } finally {
    isSending = false;
    document.getElementById('btn-send').disabled = false;
  }
}

function appendError(area, before, msg) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = msg;
  if (before) area.insertBefore(el, before);
  else area.appendChild(el);
  scrollBottom();
}

// ─── IMAGE ─────────────────────────────────────────────────────────────────

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  attachedImage = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('image-thumb').src = ev.target.result;
    document.getElementById('image-preview-wrap').classList.add('visible');
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  attachedImage = null;
  document.getElementById('file-input').value = '';
  document.getElementById('image-thumb').src = '';
  document.getElementById('image-preview-wrap').classList.remove('visible');
}

// ─── EXPORT ────────────────────────────────────────────────────────────────

async function exportConversation() {
  if (!currentConvId) return;
  try {
    const res = await authFetch(`${BACKEND_URL}/api/conversations/${currentConvId}/messages`);
    const msgs = await res.json();
    if (!msgs.length) return;
    const lines = msgs.map(m =>
      `[${m.role.toUpperCase()}] ${fmtDate(m.created_at)}\n${m.content}`
    );
    const blob = new Blob([lines.join('\n\n---\n\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tecnicoai-chat-${currentConvId}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (_) {}
}

// ─── SCHEMA ────────────────────────────────────────────────────────────────

function sanitizeSvg(svg) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svg, 'image/svg+xml');
  if (doc.documentElement.nodeName === 'parsererror') return '';
  doc.querySelectorAll('script, foreignObject').forEach(el => el.remove());
  doc.querySelectorAll('use').forEach(el => {
    const href = el.getAttribute('href') || el.getAttribute('xlink:href') || '';
    if (href.startsWith('http') || href.startsWith('javascript:')) el.remove();
  });
  doc.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
      if ((attr.name === 'href' || attr.name === 'xlink:href') && /^javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
    });
  });
  return new XMLSerializer().serializeToString(doc.documentElement);
}

function openDomainModal() {
  if (!currentConvId) {
    alert('Apri o crea una conversazione prima di generare uno schema.');
    return;
  }
  selectedDomain = 'auto';
  document.querySelectorAll('.btn-domain').forEach(b => b.classList.remove('selected'));
  const autoBtn = document.querySelector('.btn-domain[data-domain="auto"]');
  if (autoBtn) autoBtn.classList.add('selected');
  document.getElementById('domain-modal').classList.add('open');
}

function closeDomainModal() {
  document.getElementById('domain-modal').classList.remove('open');
}

function selectDomain(btn) {
  document.querySelectorAll('.btn-domain').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDomain = btn.dataset.domain;
}

function closeSchemaPanel() {
  document.getElementById('schema-panel').classList.remove('open');
}

async function downloadSchemaPdf() {
  if (!currentPdfUrl) return;
  const res = await authFetch(`${BACKEND_URL}${currentPdfUrl}`);
  if (!res.ok) { alert('Errore nel download del PDF.'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schema-${currentSchemaId}.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}

function copyDotCode() {
  if (!currentDotCode) return;
  navigator.clipboard.writeText(currentDotCode).then(() => {
    const btn = document.getElementById('btn-copy-dot');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiato';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

async function generateSchema() {
  const btn = document.getElementById('btn-generate-schema');
  btn.disabled = true;
  btn.textContent = 'Generazione...';
  closeDomainModal();

  const panel = document.getElementById('schema-panel');
  const content = document.getElementById('schema-content');
  content.innerHTML = '<div class="schema-loading"><span>⏳</span> Generazione schema in corso...</div>';
  panel.classList.add('open');

  try {
    const res = await authFetch(`${BACKEND_URL}/api/schema/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: currentConvId, domain: selectedDomain, model: 'claude' }),
    });
    if (!res.ok) {
      content.innerHTML = '<div class="schema-error">Errore nella generazione dello schema. Riprova.</div>';
      return;
    }
    const data = await res.json();
    currentSchemaId = data.schema_id;
    currentPdfUrl = data.pdf_url;
    currentDotCode = data.engine === 'graphviz' ? data.content : null;

    const badge = document.getElementById('schema-badge');
    if (data.engine === 'graphviz') {
      badge.textContent = 'Schema industriale (Graphviz)';
      badge.className = 'schema-complexity-badge badge-graphviz';
      document.getElementById('btn-copy-dot').style.display = '';
      if (data.pdf_url) {
        const pdfRes = await authFetch(`${BACKEND_URL}${data.pdf_url}`);
        if (pdfRes.ok) {
          const blob = await pdfRes.blob();
          const blobUrl = URL.createObjectURL(blob);
          content.innerHTML = `<iframe class="schema-pdf-frame" src="${blobUrl}" title="Schema PDF"></iframe>`;
        } else {
          content.innerHTML = '<div class="schema-error">PDF non disponibile.</div>';
        }
      } else {
        content.innerHTML = '<div class="schema-error">PDF non disponibile.</div>';
      }
    } else {
      badge.textContent = 'Schema semplice (SVG)';
      badge.className = 'schema-complexity-badge badge-svg';
      document.getElementById('btn-copy-dot').style.display = 'none';
      content.innerHTML = `<div class="schema-svg-wrap">${sanitizeSvg(data.content)}</div>`;
    }
  } catch (_) {
    content.innerHTML = '<div class="schema-error">Connessione persa. Verifica il backend.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Genera Schema';
  }
}

// ─── UTILS ─────────────────────────────────────────────────────────────────

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function scrollBottom() {
  const area = document.getElementById('chat-area');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 40);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
  if (isNaN(d)) return '';
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  if (diff === 1) return 'Ieri ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function md(text) {
  // Escape first, then apply markdown
  let t = text;
  // Code blocks (preserve, replace later)
  const blocks = [];
  t = t.replace(/```[\s\S]*?```/g, m => {
    blocks.push(m);
    return `\x00CODE${blocks.length - 1}\x00`;
  });
  // Escape HTML in remaining text
  t = t.split('\x00CODE').map((seg, i) => {
    if (i === 0) return esc(seg);
    const idx = seg.match(/^(\d+)\x00(.*)$/s);
    if (!idx) return seg;
    const block = blocks[parseInt(idx[1])];
    const inner = block.replace(/^```\w*\n?/, '').replace(/```$/, '');
    return `<pre><code>${esc(inner.trim())}</code></pre>${esc(idx[2])}`;
  }).join('');
  // Inline code
  t = t.replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`);
  // Bold / italic
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Headers → bold
  t = t.replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>');
  // Lists
  t = t.replace(/^[ \t]*[-*•] (.+)$/gm, '<li>$1</li>');
  t = t.replace(/^[ \t]*\d+\. (.+)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  // Paragraphs
  t = t.replace(/\n{2,}/g, '</p><p>');
  t = t.replace(/\n/g, '<br>');
  return `<p>${t}</p>`;
}

init();
</script>
</body>
</html>
